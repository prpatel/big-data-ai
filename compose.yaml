# Single compose file that runs identically locally and on Hugging Face Spaces.
#
# Every piece of persistent state (MinIO objects, Postgres, the app's downloaded
# CSV data) lives under a single "data root". That root is selected by DATA_ROOT
# and defaults to ./data locally:
#
#   - Locally    -> ./data  (project-relative, survives `docker compose down`)
#   - HF Spaces  -> /data   (the persistent storage volume HF mounts into every
#                            container in the Space) — set DATA_ROOT=/data as a
#                            Space variable, or pass it as a build/run env var.
#
# You can force a location at any time with:
#   DATA_ROOT=/some/path docker compose up -d
#
# On Hugging Face Spaces the main app is reachable at the port declared as
# `app_port` in the Space README (default 7860). The Spring app listens on 8888,
# so set `app_port: 8888` in the README metadata (see README.md).

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio1234
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 15s
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.10.2
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=P0d6Ye9v4rXDUpHUSj003yfF4E07SSBj
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=trace,axum=trace,sqlx=trace,iceberg-catalog=trace
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
  migrate:
    image: quay.io/lakekeeper/catalog:v0.10.2
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=info
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      db:
        condition: service_healthy
  trino:
    image: trinodb/trino:477
    volumes:
      - ./images/trino/lakekeeper.properties:/etc/trino/catalog/lakekeeper.properties

    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:8080/v1/status" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s
    ports:
      - "9999:8080"
  app:
    build:
      context: .
    image: big-data-ai-app
    ports:
      - "8888:8888"
    volumes:
      - ${DATA_ROOT:-./data}:/app/data
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
