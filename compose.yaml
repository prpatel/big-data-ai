# Local development stack.
#
# NOTE: Hugging Face Spaces does NOT read this file. With `sdk: docker` it builds the
# repo's Dockerfile and runs exactly one container, so on Spaces the app, Postgres,
# MinIO and LakeKeeper all run inside that single container (see docker-entrypoint.sh).
# This file is what gives you the same services as separate containers locally.
#
# Every piece of persistent state (MinIO objects, Postgres, the app's downloaded
# CSV data) lives under a single "data root". That root is selected by DATA_ROOT
# and defaults to ./data locally:
#
#   - Locally    -> ./data  (project-relative, survives `docker compose down`)
#   - HF Spaces  -> /data   (the persistent storage volume; docker-entrypoint.sh
#                            already defaults DATA_ROOT to it, and it is runtime-only,
#                            never available during the Docker build)
#
# You can force a location at any time with:
#   DATA_ROOT=/some/path docker compose up -d
#
# On Hugging Face Spaces the main app is reachable at the port declared as
# `app_port` in the Space README. The Spring app listens on 7860, which is also
# HF's default app_port, so no extra README config is needed (see README.md).

services:
  minio:
    # Pinned to match the tag the Dockerfile copies its binaries from.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio1234
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 15s
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=P0d6Ye9v4rXDUpHUSj003yfF4E07SSBj
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=trace,axum=trace,sqlx=trace,iceberg-catalog=trace
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
  migrate:
    image: quay.io/lakekeeper/catalog:v0.13.3
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=info
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      db:
        condition: service_healthy
  trino:
    image: trinodb/trino:477
    volumes:
      - ./images/trino/lakekeeper.properties:/etc/trino/catalog/lakekeeper.properties

    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:8080/v1/status" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s
    ports:
      - "9999:8080"
  app:
    build:
      context: .
    image: big-data-ai-app
    ports:
      - "7860:7860"
    volumes:
      - ${DATA_ROOT:-./data}:/app/data
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Point the analyst at any OpenAI-compatible endpoint. Unset, it uses the HF router.
      # For a model running on the host, host.docker.internal is how the container reaches it.
      # Bare names, not NAME=${NAME:-}: the latter sets the variable to an empty string when
      # it is unset on the host, and an empty value beats the default in application.properties
      # rather than falling back to it. This form passes them only when they actually exist.
      - APP_AI_BASE_URL
      - APP_AI_API_KEY
      - APP_AI_MODEL
      # The services below are already running as sibling containers, so the image's
      # entrypoint must not start its own copies - it just execs the jar. The app then
      # falls back to the compose service names baked into application.properties.
      - EMBEDDED_SERVICES=0
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
