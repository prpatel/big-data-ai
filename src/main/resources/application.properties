spring.application.name=big-data-ai
server.port=7860
spring.thymeleaf.cache=false
# for OpenAI compatible endpoints
# Spring AI 2.0 uses the official openai-java SDK, which appends only /chat/completions
# to the base-url, so the base-url must now include the /v1 suffix itself.
#
# Exactly one of the two endpoint blocks below should be active at a time.
#
# Each block carries its own thinking switch, because the two servers accept
# different parameters and the HuggingFace router 400s if it is sent the local
# server's one. Swapping endpoints is purely a matter of moving the comment
# markers - both switches travel with their block.
#
# app.ai.use-chat-template-kwargs is read by AiService, which attaches
# chat_template_kwargs {"enable_thinking": false} when it is true. That value has
# to be built in Java because it needs a real JSON boolean: properties values are
# untyped strings and extra-body binds as Map<String,Object>, so setting it here
# directly sends "false" as a string and the server returns 400. The flag itself
# is an ordinary boolean, which properties handle fine. It defaults to false, so
# forgetting to uncomment it degrades to slower answers rather than a broken app.

# Local AI Inference Server
#spring.ai.openai.base-url=http://100.119.211.80:8011/v1
#spring.ai.openai.api-key=dummy
#spring.ai.openai.chat.model=unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q6_K_XL
# honoured here; measured 17.5s with thinking, 1.3s without
#app.ai.use-chat-template-kwargs=true

# HuggingFace Inference Providers
spring.ai.openai.base-url=https://router.huggingface.co/v1
spring.ai.openai.api-key=${HF_TOKEN}
spring.ai.openai.chat.model=Qwen/Qwen3-Coder-Next:novita
# Deliberately NOT spring.ai.openai.chat.reasoning-effort: anything set there lands in the
# client's default options, and runtime options merge over defaults rather than replacing them -
# so once it is a default there is no way to *not* send it. That matters because the parameter is
# not portable: `none` is fine on ovhcloud and returns 400 "must be one of low, medium, or high"
# on groq. AiService sends this value per request and retries without it if the provider objects.
# Measured on Qwen/Qwen3.6-27B:ovhcloud: 21.7s with thinking, 1.2s without.
app.ai.reasoning-effort=none
app.ai.use-chat-template-kwargs=false
# Bills inference to an organisation rather than to the account the token belongs to,
# by sending X-HF-Bill-To. AiService adds the header only when this is non-empty.
#
# Empty by default because workshop attendees run on credits granted to their own accounts
# and are not org members: naming an org they cannot bill to returns 403 "does not have
# sufficient permissions ... on behalf of user <them>" on every call. Unset, the router
# bills whoever owns the token, which is what most people want.
#
# Set it (APP_AI_BILL_TO=<org> as a Space variable, no rebuild needed) when the token's
# inference permission sits on the org rather than on the personal account.
app.ai.bill-to=${APP_AI_BILL_TO:}

# Spring AI 2.0 dropped its built-in temperature=0.7 default and now falls back to
# whatever the provider defaults to. Pinned explicitly so SQL generation stays deterministic.
spring.ai.openai.chat.temperature=0.0
# Infrastructure endpoints.
#
# The defaults below are the docker compose service names, so `docker compose up`
# needs no extra configuration. When the whole stack runs inside a single container
# (Hugging Face Spaces, which builds only the Dockerfile and never reads compose.yaml),
# docker-entrypoint.sh exports APP_CATALOG_URI / APP_CATALOG_BASE_URL / APP_S3_ENDPOINT
# pointing at localhost instead.
#
# app.s3.endpoint is used twice: once by the app's own S3 client to create the bucket,
# and once inside the warehouse definition POSTed to LakeKeeper - LakeKeeper dials MinIO
# with it too. Both processes sit in the same network namespace in either deployment, so
# a single value is correct for both.
app.catalog.uri=${APP_CATALOG_URI:http://lakekeeper:8181/catalog}
app.catalog.base-url=${APP_CATALOG_BASE_URL:http://lakekeeper:8181}
app.s3.endpoint=${APP_S3_ENDPOINT:http://minio:9000}

# Hard ceiling for a query result. The per-query row field on the page cannot exceed this.
app.sql.max-rows=200
