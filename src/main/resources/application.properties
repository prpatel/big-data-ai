spring.application.name=big-data-ai
server.port=8888
spring.thymeleaf.cache=false
# for OpenAI compatible endpoints
# Spring AI 2.0 uses the official openai-java SDK, which appends only /chat/completions
# to the base-url, so the base-url must now include the /v1 suffix itself.
spring.ai.openai.base-url=https://router.huggingface.co/v1
spring.ai.openai.api-key=${HF_TOKEN}
spring.ai.openai.chat.model=Qwen/Qwen3.6-27B:ovhcloud
# Spring AI 2.0 dropped its built-in temperature=0.7 default and now falls back to
# whatever the provider defaults to. Pinned explicitly so SQL generation stays deterministic.
spring.ai.openai.chat.temperature=0.0
# Disables Qwen3.6 thinking. This provider rejects chat_template_kwargs outright and
# ignores the /no_think prompt token, but honours the standard OpenAI reasoning_effort
# parameter. Measured against the live endpoint: 21.7s with reasoning, 1.2s without.
spring.ai.openai.chat.reasoning-effort=none
# HTTP connection pooling
# for ollama
# The base URL of your running Ollama instance
# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.model=qwen3-coder:latest

# Optional: You can configure other model parameters like temperature
#spring.ai.ollama.chat.temperature=0.1
logging.level.org.springframework.web.client=DEBUG
logging.level.org.apache.hc=DEBUG
