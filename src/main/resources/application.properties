spring.application.name=big-data-ai
server.port=8888
spring.thymeleaf.cache=false
# for OpenAI compatible endpoints
# Spring AI 2.0 uses the official openai-java SDK, which appends only /chat/completions
# to the base-url, so the base-url must now include the /v1 suffix itself.
#
# Exactly one of the two endpoint blocks below should be active at a time.
#
# THINKING IS NOT CONFIGURED HERE - it is set in AiService, deliberately.
# The two servers accept different parameters for it:
#   local server        honours chat_template_kwargs {"enable_thinking": false}
#                       and ignores reasoning_effort
#   HuggingFace router  honours reasoning_effort=none and rejects
#                       chat_template_kwargs outright with a 400
# chat_template_kwargs needs a real JSON boolean, and a .properties file cannot
# produce one: values here are untyped strings and extra-body binds as
# Map<String,Object>, so "false" arrives as a string and the server returns
# 400 (expected boolean, got string). AiService therefore sets both switches in
# Java, where the boolean is real, and it does so for whichever endpoint is active.

# Local AI Inference Server
spring.ai.openai.base-url=http://100.119.211.80:8011/v1
spring.ai.openai.api-key=dummy
spring.ai.openai.chat.model=unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q6_K_XL

# HuggingFace Inference Providers
#spring.ai.openai.base-url=https://router.huggingface.co/v1
#spring.ai.openai.api-key=${HF_TOKEN}
#spring.ai.openai.chat.model=Qwen/Qwen3.6-27B:ovhcloud

# Spring AI 2.0 dropped its built-in temperature=0.7 default and now falls back to
# whatever the provider defaults to. Pinned explicitly so SQL generation stays deterministic.
spring.ai.openai.chat.temperature=0.0
# HTTP connection pooling
# for ollama
# The base URL of your running Ollama instance
# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.model=qwen3-coder:latest

# Optional: You can configure other model parameters like temperature
#spring.ai.ollama.chat.temperature=0.1
logging.level.org.springframework.web.client=DEBUG
logging.level.org.apache.hc=DEBUG
