<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Iceberg/Spark/AI Demo</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Power Analytics with Iceberg/Spark/AI Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" >
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
</head>
<body>
<main class="container">
    <section>
        <h1>AI Real Estate Analyst: Iceberg/Spark/AI Demo</h1>
        <a href="/admin">Admin</a>

        <section>
            <input type="text"
                   id="q"
                   name="q"
                   placeholder="Enter in your question here"
                   value="show me all the properties sold in Oxford in September 2015"
            >
        </section>

        <button hx-post="/generatequery"
                hx-trigger="click"
                hx-target="#generatedsql"
                hx-include="#q">
            Generate Query
        </button>
    </section>

    <section>
        <div id="generatedsql" name="generatedsql" value="placeholder"></div>

        <label for="maxrows">
            Rows to return
            <input type="number" id="maxrows" name="maxrows" value="50" min="1" max="200">
        </label>

        <button hx-post="/runquery"
                hx-trigger="click"
                hx-target="#queryresult"
                hx-include="#generatedsql, #maxrows">
            Run Query
        </button>
    </section>

    <section>
            <pre id="queryresult">

            </pre>
    </section>

</main>

<script>
    // Keep whatever the user typed when they wander off to /admin and come back. The link there
    // is an ordinary navigation, so the browser reloads this page and the field would otherwise
    // reset to the example above.
    //
    // localStorage rather than anything server-side on purpose: the question is a per-person
    // convenience, and this app may be one public Space shared by a room - nobody's half-typed
    // question should show up in someone else's browser.
    (function () {
        var KEY = 'bigdataai.question';
        var q = document.getElementById('q');
        if (!q) return;

        try {
            var saved = localStorage.getItem(KEY);
            // null means a genuine first visit, so the example stays. An empty string means the
            // user deliberately cleared the box, and that is respected.
            if (saved !== null) q.value = saved;
        } catch (e) {
            // Private windows and blocked site data throw here. The example is a fine fallback.
        }

        q.addEventListener('input', function () {
            try { localStorage.setItem(KEY, q.value); } catch (e) { /* not worth failing over */ }
        });
    })();
</script>
</body>
</html>
