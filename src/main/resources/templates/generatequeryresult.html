<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>fragments</title>
</head>
<body>
<div th:fragment="result" id="parent-div">

    <!-- The model was asked for JSON. When it answers with something else the raw reply is shown
         here instead of being quietly repaired, because the fix belongs in the system prompt. -->
    <article th:if="${error}" style="border-left:3px solid var(--pico-del-color);padding-left:1rem">
        <strong th:text="${error}"></strong>
        <pre style="white-space:pre-wrap"><code th:text="${raw}"></code></pre>
    </article>

    <textarea
            id="generatedsql"
            name="generatedsql"
            rows="4"
            th:text="${result}"
    ></textarea>

    <small th:if="${assumptions != null and !assumptions.isEmpty()}">
        <strong>Assumptions:</strong> <span th:text="${assumptions}"></span>
    </small>
    <small th:if="${columnsUsed != null and !columnsUsed.isEmpty()}">
        <br><strong>Columns used:</strong> <span th:text="${columnsUsed}"></span>
    </small>
</div>
</body>
</html>
